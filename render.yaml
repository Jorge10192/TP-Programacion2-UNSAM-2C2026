# App React + API; PostgreSQL se configura aparte.
services:
  - type: web
    name: walos-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.walos
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
