[project]
name = "proyecto-3-extendido-generico-backend"
version = "0.1.0"
description = "Backend API for Proyecto-3-Extendido-Generico."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "pydantic-settings",
    "pwdlib[argon2]",
    "pyjwt",
    "sqlalchemy",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
