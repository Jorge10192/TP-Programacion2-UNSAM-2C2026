[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-pyme-backend"
version = "0.2.0"
description = "API REST de Asistente PyME - backend academico incremental"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "SQLAlchemy>=2.0.57,<2.1",
    "alembic>=1.20.1,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "httpx2>=2.16,<3.0",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests de integracion con PostgreSQL real (requieren RUN_DB_INTEGRATION=1)",
]
