# API actual en el servicio Free existente. Las bases anteriores se conservan.
# Crear plataforma_pyme vacia en la instancia PostgreSQL existente antes del deploy.
# Completar DB_HOST, DB_USER y POSTGRES_PASSWORD en Render, nunca en Git.
services:
  - type: web
    name: walos-api
    runtime: docker
    plan: free
    region: oregon
    branch: codex/pyme-render-deploy
    dockerfilePath: ./plataforma-pyme/backend/Dockerfile
    dockerContext: ./plataforma-pyme/backend
    dockerCommand: >-
      /bin/sh -c "python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8000"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: plataforma_pyme
      - key: DB_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
