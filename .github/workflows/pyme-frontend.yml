name: Asistente PyME frontend
on:
  push:
    paths: ['plataforma-pyme/frontend/**', '.github/workflows/pyme-frontend.yml']
  pull_request:
    paths: ['plataforma-pyme/frontend/**', '.github/workflows/pyme-frontend.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma-pyme/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plataforma-pyme/frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
