name: WALOS
on:
  push:
    paths: ['Proyecto-3-AppAdmin-Mascotas/**', '.github/workflows/walos-tests.yml']
  pull_request:
    paths: ['Proyecto-3-AppAdmin-Mascotas/**', '.github/workflows/walos-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: walos
          POSTGRES_PASSWORD: ci-temporal
          POSTGRES_DB: walos_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U walos -d walos_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WALOS_TEST_POSTGRES_URL: postgresql+psycopg://walos:ci-temporal@localhost:5432/walos_ci_test
    defaults:
      run:
        working-directory: Proyecto-3-AppAdmin-Mascotas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'Proyecto-3-AppAdmin-Mascotas/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t walos-ci .
      - name: Comprobar arranque Docker
        run: |
          docker run -d --name walos-ci -p 127.0.0.1:18000:8000 walos-ci
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2) as response:
                      assert json.load(response) == {'status': 'ok'}
                  break
              except (OSError, AssertionError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - name: Detener contenedor de prueba
        if: always()
        run: docker rm -f walos-ci 2>/dev/null || true
